name: Import tournament

on:
  workflow_dispatch:
    inputs:
      tournament_id:
        description: "Tournament Service ID"
        required: true
        type: string
      tournament_date:
        description: "Tournament date (YYYY-MM-DD)"
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tournament-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate input
        env:
          TOURNAMENT_ID: ${{ inputs.tournament_id }}
          TOURNAMENT_DATE: ${{ inputs.tournament_date }}
        run: |
          [[ "$TOURNAMENT_ID" =~ ^[0-9]+$ ]]
          [[ "$TOURNAMENT_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]

      - name: Import tournament
        env:
          TOURNAMENT_ID: ${{ inputs.tournament_id }}
          TOURNAMENT_DATE: ${{ inputs.tournament_date }}
        run: |
          python3 scrape_tournament.py "$TOURNAMENT_ID" "$TOURNAMENT_DATE"
          python3 yearly_ranking.py "${TOURNAMENT_DATE:0:4}"

      - name: Commit generated data
        env:
          TOURNAMENT_ID: ${{ inputs.tournament_id }}
          TOURNAMENT_DATE: ${{ inputs.tournament_date }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs ranking_*.csv

          if git diff --cached --quiet; then
            echo "No generated files changed."
          else
            git commit -m "Import tournament ${TOURNAMENT_ID} (${TOURNAMENT_DATE})"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4