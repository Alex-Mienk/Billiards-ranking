name: Rebuild website

on:
  workflow_dispatch:
    inputs:
      season_year:
        description: "Ranking year"
        required: true
        default: "2026"
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: website-update
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate input
        env:
          SEASON_YEAR: ${{ inputs.season_year }}
        run: |
          [[ "$SEASON_YEAR" =~ ^[0-9]{4}$ ]]
          (( SEASON_YEAR >= 2000 ))

      - name: Rebuild website data
        env:
          SEASON_YEAR: ${{ inputs.season_year }}
        run: python3 yearly_ranking.py "$SEASON_YEAR"

      - name: Commit generated data
        env:
          SEASON_YEAR: ${{ inputs.season_year }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs ranking_*.csv

          if git diff --cached --quiet; then
            echo "No generated files changed."
          else
            git commit -m "Rebuild ${SEASON_YEAR} website data"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
